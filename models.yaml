# rocm-llama models manifest
#
# This file is the **source of truth** for what we run and where each GGUF came from.
# `make models-apply` reads this file, downloads missing GGUFs, and regenerates
# config/llama-swap.yaml.
#
# Each entry:
#   name:        OpenAI model id (alias — what clients use)
#   enabled:     true | false  (false = candidate, not installed/served)
#   engine:      llama-server | sd-server
#   path:        Ollama blob path on the host (preferred — no download needed)
#   repo:        Hugging Face repo id (e.g. "unsloth/GLM-4.7-Flash-GGUF")
#   file:        HF filename (may be a glob/split set)
#   url:         Direct download URL (alternative to repo/file)
#   ctx:         Context size (-c)
#   template:    Jinja template file in templates/ (--chat-template-file)
#   reasoning:   true/false — use --reasoning-format deepseek
#   temp:        Temperature (default 0.6)
#   top_p:       Top-p (default 0.95)
#   max_tokens:  Max output tokens (default 1024)
#   ngf:         GPU layers (-ngl, default 99 for ROCm)
#   device:      ROCm device flag (default --device HIP0)
#   extra:       Extra llama-server flags
#   civitai:     Civitai model version id (alternative to repo/file)
#   civitai_file: Civitai file to download (default: primary)
#
# LiteLLM metadata (optional):
#   litellm:
#     description: "..."
#     supports_function_calling: true
#     supports_tool_choice: true
#     supports_reasoning: true
#     supports_vision: true
#   decode_tps:  Measured decode tokens/second (used to derive costs)
#   cost:        Per-token cost override (falls back to cost: block below)
#
# Top-level cost block: prices GPU time as electricity × amortization.
#   cost:
#     watts: 300
#     usd_per_kwh: 0.18
#     amortization: 3
#     input_factor: 4

# Ownership tag for the shared LiteLLM proxy. `make sync-litellm` writes this to
# each model's model_info.stack and will ONLY delete stale models carrying this
# tag — so the Battlemage SYCL stack (stack: battlemage) can share the same proxy
# without the two syncs deleting each other's models.
stack: rocm

cost:
  watts: 300
  usd_per_kwh: 0.18
  amortization: 3
  input_factor: 4

models:
  # --- Code models ---
  - name: qwen3-coder-30b
    enabled: true
    engine: llama-server
    path: /models/qwen3-coder-30b-AWQ.gguf
    ctx: 131072
    template: qwen3-coder.jinja
    temp: 0.6
    top_p: 0.95
    decode_tps: 28
    litellm:
      description: "Qwen3 Coder 30B — code generation, strong tool use"
      supports_function_calling: true
      supports_tool_choice: true

  - name: glm-4.7-flash-q4
    enabled: true
    engine: llama-server
    repo: unsloth/GLM-4.7-Flash-GGUF
    file: GLM-4.7-Flash-Q4_K_XL.gguf
    name_hint: glm-4.7-flash
    ctx: 131072
    template: glm-4.7-flash.jinja
    reasoning: true
    temp: 0.6
    top_p: 0.95
    decode_tps: 35
    litellm:
      description: "GLM-4.7 Flash — reasoning model with long context"
      supports_reasoning: true

  # --- General purpose ---
  - name: qwen3-14b
    enabled: true
    engine: llama-server
    path: /models/qwen3-14b-Q4_K_M.gguf
    ctx: 131072
    template: qwen3.jinja
    temp: 0.6
    top_p: 0.95
    decode_tps: 42
    litellm:
      description: "Qwen3 14B — balanced general purpose model"
      supports_function_calling: true

  - name: llama3.1-8b
    enabled: false
    engine: llama-server
    path: /models/llama3.1-8b-Q4_K_M.gguf
    ctx: 8192
    template: llama3.1.jinja
    temp: 0.6
    top_p: 0.95
    litellm:
      description: "Llama 3.1 8B — fast general purpose model"
      supports_function_calling: true

  # --- Large models (when VRAM allows) ---
  - name: qwen3-32b
    enabled: false
    engine: llama-server
    path: /models/qwen3-32b-Q4_K_M.gguf
    ctx: 131072
    template: qwen3.jinja
    temp: 0.6
    top_p: 0.95
    decode_tps: 18
    litellm:
      description: "Qwen3 32B — high-capability general purpose"

  # --- Image generation ---
  - name: sdxl
    enabled: true
    engine: sd-server
    repo: stabilityai/stable-diffusion-xl-base-1.0
    file: sd_xl_base_1.0.safetensors
    ctx: 768
    temp: 0.8
    max_tokens: 0
    extra: "--dim 1024"

  # ===========================================================================
  # SMALL / MoE cross-stack models on the RX 6650 XT (8 GB, gfx1030). These are
  # the `-rocm`-suffixed siblings of the same models on the Battlemage B70 — the
  # suffix flags the SLOWER backend. decode_tps below is the MEASURED 6650 XT
  # figure (see docs/benchmarks.md); paired with cost.watts:300 it prices these
  # higher per token than the B70, which is correct (slower + drawier).
  #
  # NOTE: on this host the live config/llama-swap.yaml is currently hand-
  # maintained (it diverged from the generic template entries above), so these
  # are served from that file, not regenerated via `make models-apply`. The
  # entries here are the tracked source for LiteLLM metadata (descriptions,
  # decode_tps -> cost) and provenance. Reconciling the whole manifest to the
  # live config is a separate follow-up.
  # ===========================================================================

  - name: ministral-3-8b-rocm
    enabled: true
    engine: llama-server
    path: /models/ministral-3-8b/Q4_K_M.gguf
    ctx: 16384
    temp: 0.7
    top_p: 0.95
    extra: "-fa on"
    decode_tps: 45
    litellm:
      description: "Ministral 3 8B Instruct (2512) dense — RX 6650 XT (ROCm, SLOWER), ~45 t/s decode. Dense daily-driver 8B; tool calling. B70 sibling: ministral-3-8b (~78 t/s)."
      supports_function_calling: true
      supports_tool_choice: true

  - name: lfm2-8b-a1b-rocm
    enabled: true
    engine: llama-server
    path: /models/lfm2-8b-a1b/Q5_K_M.gguf
    ctx: 8192
    extra: "-fa on"
    decode_tps: 157
    litellm:
      description: "LFM2-8B-A1B (Liquid AI) MoE 8.3B/1.5B-active — RX 6650 XT (ROCm, SLOWER), ~157 t/s decode. Best speed/quality on this card; nearly matches the B70 (179 t/s) since MoE decode is active-param bound. B70 sibling: lfm2-8b-a1b."
      supports_function_calling: true

  - name: gemma-4-e4b-rocm
    enabled: true
    engine: llama-server
    path: /models/gemma-4-e4b/Q6_K.gguf
    ctx: 32768
    temp: 1.0
    top_p: 0.95
    extra: "-fa on --top-k 64"
    decode_tps: 50
    litellm:
      description: "Gemma 4 E4B (it) — RX 6650 XT (ROCm, SLOWER), ~50 t/s decode. Tiny PLE-offload model, long-context comfort pick. B70 sibling: gemma-4-e4b (~68 t/s)."
      supports_function_calling: true
      supports_tool_choice: false
      supports_reasoning: true

  # The original two 6650 XT bring-up models, suffixed -rocm for the shared proxy.
  - name: llama3.1-8b-rocm
    enabled: true
    engine: llama-server
    path: /models/llama3.1-8b/Q4_K_M.gguf
    ctx: 16384
    temp: 0.6
    top_p: 0.95
    decode_tps: 47
    litellm:
      description: "Llama 3.1 8B — RX 6650 XT (ROCm, SLOWER), ~47 t/s decode. The reliable baseline / daily driver on this card."
      supports_function_calling: true

  - name: gemma-4-12b-rocm
    enabled: true
    engine: llama-server
    path: /models/gemma-4-12b/Q4_K_M.gguf
    ctx: 2048
    temp: 1.0
    top_p: 0.95
    extra: "-fa on --top-k 64"
    decode_tps: 30
    litellm:
      description: "Gemma 4 12B — RX 6650 XT (ROCm, SLOWER), ~30 t/s decode. Razor-thin fit (8 GB), -c 2048 only; a 'runs at all' stretch, not a daily driver. B70 sibling: gemma-4-12b (much roomier)."
      supports_function_calling: true
      supports_tool_choice: false
      supports_reasoning: true
