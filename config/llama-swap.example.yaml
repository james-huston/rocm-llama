# llama-swap configuration — ROCm/HIP backend
#
# This is an EXAMPLE config. Copy to config/llama-swap.yaml and edit.
# After the first setup, this file is regenerated by `make models-apply`.
#
# See: https://github.com/mostlygeek/llama-swap

llama-servers:
  # --- Code model ---
  qwen3-coder-30b:
    model: /models/qwen3-coder-30b-AWQ.gguf
    ctx: 131072
    chat_template_file: /templates/qwen3-coder.jinja
    temp: 0.6
    top_p: 0.95
    ngf: 99
    device: HIP0
    jinja: true
    extra: ""

  # --- Reasoning model ---
  glm-4.7-flash-q4:
    model: /models/glm-4.7-flash-q4/GLM-4.7-Flash-Q4_K_XL.gguf
    ctx: 131072
    chat_template_file: /templates/glm-4.7-flash.jinja
    reasoning_format: deepseek
    temp: 0.6
    top_p: 0.95
    max_tokens: 1024
    ngf: 99
    device: HIP0
    jinja: true
    extra: ""

  # --- General purpose ---
  qwen3-14b:
    model: /models/qwen3-14b-Q4_K_M.gguf
    ctx: 131072
    chat_template_file: /templates/qwen3.jinja
    temp: 0.6
    top_p: 0.95
    ngf: 99
    device: HIP0
    jinja: true
    extra: ""

  # --- Image generation ---
  sdxl:
    engine: sd-server
    model: /models/sdxl/sd_xl_base_1.0.safetensors
    temp: 0.8
    max_tokens: 0
    dim: 1024
    extra: ""

# Default settings for servers not explicitly configured
default:
  ctx: 8192
  temp: 0.6
  top_p: 0.95
  ngf: 99
  device: HIP0
  jinja: false
  extra: ""
